<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobVault - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .login-card {
            border: none;
            border-radius: 15px;
        }

        .form-control {
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #000;
            box-shadow: 0 0 0 0.15rem rgba(0, 0, 0, 0.1);
        }

        .btn-dark {
            border-radius: 8px;
        }

        .navbar-brand {
            letter-spacing: 1px;
        }

        footer {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-black navbar-dark">

            <div class="container">

                <a class="navbar-brand fw-bold" href="">
                    JobVault
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" onclick=" event.preventDefault(); goHome()">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="signup.html">
                                Sign Up
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>
    </header>


    <main>

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                    <div class="card login-card shadow-sm p-4">

                        <h2 class="text-center fw-bold mb-2">
                            Welcome Back
                        </h2>

                        <p class="text-center text-secondary mb-4">
                            Login to manage your job applications
                        </p>

                        <form onsubmit="handleLogin(event)">

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email" id="email" required class="form-control"
                                    placeholder="Enter your email">

                            </div>

                            <div class="mb-4">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password" id="password" required class="form-control"
                                    placeholder="Enter your password">

                            </div>

                            <button type="submit" class="btn btn-dark w-100">
                                Login
                            </button>

                        </form>

                        <p class="text-center mt-4 mb-0">

                            Don't have an account?

                            <a href="signup.html" class="text-dark fw-semibold text-decoration-none">
                                Sign Up
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer class="bg-black text-white">

        <div class="container py-3">

            <div class="text-center">

                <h6 class="fw-bold mb-1">
                    JobVault
                </h6>

                <p class="small text-secondary mb-2">
                    Track your applications. Manage your career.
                </p>

                <p class="small mb-0">
                    © 2026 JobVault
                </p>

            </div>

        </div>

    </footer>


    <script>

        let email = document.getElementById("email");
        let password = document.getElementById("password");

        let currentUser = JSON.parse(sessionStorage.getItem("currentUser"));
        let isLoggedIn = sessionStorage.getItem("isLoggedIn");

        let goHome = () => {

            if (isLoggedIn === "true" && currentUser) {
                window.location.href = "home.html";
            } else {
                alert("Oops! You need to login first.");
            }

        };

        let handleLogin = async (event) => {

            event.preventDefault();

            let data = await fetch("http://localhost:3000/users");
            let users = await data.json();

            let verifiedUser = users.find((user) => {
                return user.email === email.value.toLowerCase();
            });

            if (!verifiedUser) {
                alert("Email doesnt exist");
                return;
            }

            if (verifiedUser.password !== password.value) {
                alert("Password is Incorrect!");
                return;
            }

            sessionStorage.setItem("currentUser", JSON.stringify(verifiedUser));
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("showWelcome" , "true");

            
            window.location.href = "home.html";
        };

    </script>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
