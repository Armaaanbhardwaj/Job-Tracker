<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobVault - Resume Information</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 72px;
        }

        main {
            flex: 1;
            padding: 50px 0;
        }

        .navbar {
            min-height: 72px;
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1030;
            background: #000 !important;
        }

        .navbar-brand {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-link {
            font-size: 14px;
            margin: 0 7px;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .navbar .btn {
            border-radius: 8px;
        }

        .resume-form-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 40px;
        }

        .page-title {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #777;
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 8px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: #000;
            box-shadow: 0 0 0 0.15rem rgba(0, 0, 0, 0.08);
        }

        .section-divider {
            margin: 35px 0;
            border-color: #ddd;
        }

        .btn-dark {
            border-radius: 8px;
            padding: 10px 25px;
        }

        .entry-card {
            background: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        footer {
            background: #000;
            color: white;
            padding: 35px 0 20px;
        }

        .footer-brand {
            font-size: 20px;
            font-weight: 700;
        }

        .footer-text {
            color: #777;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            main {
                padding: 30px 0;
            }

            .resume-form-card {
                padding: 25px 18px;
            }

            .page-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                JobVault
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link text-white" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="applications.html">
                            Applications
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white active" href="resume_builder.html">
                            Resume Builder
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="home.html">
                            Dashboard
                        </a>
                    </li>

                </ul>

                <div class="d-flex">

                    <button class="btn btn-outline-light btn-sm px-3" onclick="handleLogout()">
                        Logout
                    </button>

                </div>

            </div>

        </div>

    </nav>

    <main>

        <div class="container">

            <div class="mb-4">

                <h1 class="page-title">
                    Resume Information
                </h1>

                <p class="page-subtitle">
                    Enter your information to create your professional resume.
                </p>

            </div>

            <div class="card resume-form-card shadow-sm">

                <form id="resumeForm">

                    <div>

                        <h2 class="section-title">
                            Personal Information
                        </h2>

                        <div class="row g-3">

                            <div class="col-12">

                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>

                                <input type="text" id="fullName" class="form-control"
                                    placeholder="Enter your full name" required>

                            </div>

                            <div class="col-md-6">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email" id="email" class="form-control"
                                    placeholder="Enter your email" required>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Phone Numbers
                                </label>

                                <div id="phoneContainer"></div>

                                <button type="button" class="btn btn-outline-dark btn-sm mt-2" onclick="addPhone()">
                                    + Add Phone
                                </button>

                            </div>

                            <div class="col-12">

                                <label for="linkedin" class="form-label">
                                    LinkedIn
                                </label>

                                <input type="url" id="linkedin" class="form-control"
                                    placeholder="https://linkedin.com/in/your-profile">

                            </div>

                        </div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Education
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addEducation()">
                                + Add Education
                            </button>

                        </div>

                        <div id="educationContainer"></div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Experience
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addExperience()">
                                + Add Experience
                            </button>

                        </div>

                        <div id="experienceContainer"></div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Skills
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addSkill()">
                                + Add Skill
                            </button>

                        </div>

                        <div id="skillsContainer"></div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Projects
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addProject()">
                                + Add Project
                            </button>

                        </div>

                        <div id="projectsContainer"></div>

                    </div>

                    <div class="d-flex justify-content-end mt-4">

                        <button type="submit" class="btn btn-dark">
                            Update Resume
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

    <footer>

        <div class="container">

            <div class="footer-brand">
                JobVault
            </div>

            <div class="footer-text">
                Build your professional resume with JobVault.
            </div>

        </div>

    </footer>

    <script>

        let currentUser = JSON.parse(sessionStorage.getItem("currentUser"));
        let isLoggedIn = sessionStorage.getItem("isLoggedIn");

        if (isLoggedIn !== "true" || !currentUser) {
            window.location.href = "login.html";
        }

        const phoneContainer = document.getElementById("phoneContainer");
        const educationContainer = document.getElementById("educationContainer");
        const experienceContainer = document.getElementById("experienceContainer");
        const skillsContainer = document.getElementById("skillsContainer");
        const projectsContainer = document.getElementById("projectsContainer");

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function addPhone(value = "") {

            let div = document.createElement("div");

            div.className = "input-group mb-2 phone-item";

            div.innerHTML = `
                <input type="tel"
                    class="form-control phone-input"
                    placeholder="Enter phone number"
                    value="${escapeHtml(value)}"
                    required>

                <button type="button"
                    class="btn btn-outline-danger"
                    onclick="removeItem(this)">
                    Remove
                </button>
            `;

            phoneContainer.appendChild(div);
        }

        function addEducation(data = {}) {

            let div = document.createElement("div");

            div.className = "entry-card education-item";

            div.innerHTML = `
                <div class="row g-3">

                    <div class="col-12">

                        <label class="form-label">
                            College / University
                        </label>

                        <input type="text"
                            class="form-control education-college"
                            placeholder="Enter college or university"
                            value="${escapeHtml(data.college || "")}">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Degree
                        </label>

                        <input type="text"
                            class="form-control education-degree"
                            placeholder="e.g. B.Tech Computer Science"
                            value="${escapeHtml(data.degree || "")}">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Graduation Year
                        </label>

                        <input type="text"
                            class="form-control education-year"
                            placeholder="e.g. 2027"
                            value="${escapeHtml(data.graduationYear || "")}">

                    </div>

                </div>

                <button type="button"
                    class="btn btn-outline-danger btn-sm mt-3"
                    onclick="removeItem(this)">
                    Remove Education
                </button>
            `;

            educationContainer.appendChild(div);
        }

        function addExperience(data = {}) {

            let div = document.createElement("div");

            div.className = "entry-card experience-item";

            div.innerHTML = `
                <div class="row g-3">

                    <div class="col-12">

                        <label class="form-label">
                            Company
                        </label>

                        <input type="text"
                            class="form-control experience-company"
                            placeholder="Enter company name"
                            value="${escapeHtml(data.company || "")}">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Job Role
                        </label>

                        <input type="text"
                            class="form-control experience-role"
                            placeholder="e.g. Software Developer"
                            value="${escapeHtml(data.jobRole || "")}">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Duration
                        </label>

                        <input type="text"
                            class="form-control experience-duration"
                            placeholder="e.g. Jan 2025 - Present"
                            value="${escapeHtml(data.duration || "")}">

                    </div>

                </div>

                <button type="button"
                    class="btn btn-outline-danger btn-sm mt-3"
                    onclick="removeItem(this)">
                    Remove Experience
                </button>
            `;

            experienceContainer.appendChild(div);
        }

        function addSkill(value = "") {

            let div = document.createElement("div");

            div.className = "input-group mb-2 skill-item";

            div.innerHTML = `
                <input type="text"
                    class="form-control skill-input"
                    placeholder="e.g. JavaScript"
                    value="${escapeHtml(value)}"
                    required>

                <button type="button"
                    class="btn btn-outline-danger"
                    onclick="removeItem(this)">
                    Remove
                </button>
            `;

            skillsContainer.appendChild(div);
        }

        function addProject(data = {}) {

            let div = document.createElement("div");

            div.className = "entry-card project-item";

            div.innerHTML = `
                <div class="row g-3">

                    <div class="col-12">

                        <label class="form-label">
                            Project Name
                        </label>

                        <input type="text"
                            class="form-control project-name"
                            placeholder="Enter project name"
                            value="${escapeHtml(data.name || "")}">

                    </div>

                    <div class="col-12">

                        <label class="form-label">
                            Project Details
                        </label>

                        <textarea
                            class="form-control project-details"
                            rows="3"
                            placeholder="Describe your project">${escapeHtml(data.details || "")}</textarea>

                    </div>

                </div>

                <button type="button"
                    class="btn btn-outline-danger btn-sm mt-3"
                    onclick="removeItem(this)">
                    Remove Project
                </button>
            `;

            projectsContainer.appendChild(div);
        }

        function removeItem(button) {

            button.closest(
                ".phone-item, .education-item, .experience-item, .skill-item, .project-item"
            ).remove();

        }

        const savedData = localStorage.getItem("jobVaultResume");

        if (savedData) {

            const data = JSON.parse(savedData);

            document.getElementById("fullName").value =
                data.fullName || "";

            document.getElementById("email").value =
                data.email || "";

            document.getElementById("linkedin").value =
                data.linkedin || "";

            let phones =
                data.phones ||
                (data.phone ? [data.phone] : []);

            phones.forEach(phone => addPhone(phone));

            let education =
                data.education || [];

            if (
                !education.length &&
                (data.college ||
                    data.degree ||
                    data.graduationYear)
            ) {

                education = [{
                    college: data.college || "",
                    degree: data.degree || "",
                    graduationYear: data.graduationYear || ""
                }];

            }

            education.forEach(item => addEducation(item));

            let experience =
                data.experience || [];

            if (
                !experience.length &&
                (data.company ||
                    data.jobRole ||
                    data.experienceDuration)
            ) {

                experience = [{
                    company: data.company || "",
                    jobRole: data.jobRole || "",
                    duration: data.experienceDuration || ""
                }];

            }

            experience.forEach(item => addExperience(item));

            let skills =
                data.skillsList ||
                (
                    data.skills
                        ? data.skills
                            .split(",")
                            .map(skill => skill.trim())
                            .filter(Boolean)
                        : []
                );

            skills.forEach(skill => addSkill(skill));

            let projects =
                data.projectList || [];

            if (!projects.length && data.projects) {

                projects = [{
                    name: "",
                    details: data.projects
                }];

            }

            projects.forEach(project => addProject(project));
        }

        if (!phoneContainer.children.length) {
            addPhone();
        }

        if (!educationContainer.children.length) {
            addEducation();
        }

        if (!experienceContainer.children.length) {
            addExperience();
        }

        if (!skillsContainer.children.length) {
            addSkill();
        }

        if (!projectsContainer.children.length) {
            addProject();
        }

        document.getElementById("resumeForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const phones =
                    [...document.querySelectorAll(".phone-input")]
                        .map(input => input.value.trim())
                        .filter(Boolean);

                const education =
                    [...document.querySelectorAll(".education-item")]
                        .map(item => ({
                            college:
                                item.querySelector(".education-college").value.trim(),

                            degree:
                                item.querySelector(".education-degree").value.trim(),

                            graduationYear:
                                item.querySelector(".education-year").value.trim()
                        }))
                        .filter(item =>
                            item.college ||
                            item.degree ||
                            item.graduationYear
                        );

                const experience =
                    [...document.querySelectorAll(".experience-item")]
                        .map(item => ({
                            company:
                                item.querySelector(".experience-company").value.trim(),

                            jobRole:
                                item.querySelector(".experience-role").value.trim(),

                            duration:
                                item.querySelector(".experience-duration").value.trim()
                        }))
                        .filter(item =>
                            item.company ||
                            item.jobRole ||
                            item.duration
                        );

                const skillsList =
                    [...document.querySelectorAll(".skill-input")]
                        .map(input => input.value.trim())
                        .filter(Boolean);

                const projectList =
                    [...document.querySelectorAll(".project-item")]
                        .map(item => ({
                            name:
                                item.querySelector(".project-name").value.trim(),

                            details:
                                item.querySelector(".project-details").value.trim()
                        }))
                        .filter(item =>
                            item.name ||
                            item.details
                        );

                const resumeData = {

                    fullName:
                        document.getElementById("fullName").value.trim(),

                    email:
                        document.getElementById("email").value.trim(),

                    phones:

                        phones,

                    linkedin:
                        document.getElementById("linkedin").value.trim(),

                    education:
                        education,

                    experience:
                        experience,

                    skillsList:
                        skillsList,

                    projectList:
                        projectList,

                    phone:
                        phones[0] || "",

                    college:
                        education[0]?.college || "",

                    degree:
                        education[0]?.degree || "",

                    graduationYear:
                        education[0]?.graduationYear || "",

                    company:
                        experience[0]?.company || "",

                    jobRole:
                        experience[0]?.jobRole || "",

                    experienceDuration:
                        experience[0]?.duration || "",

                    skills:
                        skillsList.join(", "),

                    projects:
                        projectList
                            .map(project =>
                                `${project.name}${project.details
                                    ? " - " + project.details
                                    : ""}`
                            )
                            .join("\n")
                };

                localStorage.setItem(
                    "jobVaultResume",
                    JSON.stringify(resumeData)
                );

                window.location.href =
                    "template.html";

            });

        function handleLogout() {

            sessionStorage.removeItem("currentUser");
            sessionStorage.removeItem("isLoggedIn");
            sessionStorage.removeItem("showWelcome");

            window.location.href =
                "login.html";

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
