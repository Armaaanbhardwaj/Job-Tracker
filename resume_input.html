<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JobVault - Resume Information</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 72px;
        }

        main {
            flex: 1;
            padding: 50px 0;
        }

        .navbar {
            min-height: 72px;
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1030;
            background: #000 !important;
        }

        .navbar-brand {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-link {
            font-size: 14px;
            margin: 0 7px;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .navbar .btn {
            border-radius: 8px;
        }

        .resume-form-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 40px;
        }

        .page-title {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #777;
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 8px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: #000;
            box-shadow: 0 0 0 0.15rem rgba(0, 0, 0, 0.08);
        }

        .section-divider {
            margin: 35px 0;
            border-color: #ddd;
        }

        .btn-dark {
            border-radius: 8px;
            padding: 10px 25px;
        }

        footer {
            background: #000;
            color: white;
            padding: 35px 0 20px;
        }

        .footer-brand {
            font-size: 20px;
            font-weight: 700;
        }

        .footer-text {
            color: #777;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {

            main {
                padding: 30px 0;
            }

            .resume-form-card {
                padding: 25px 18px;
            }

            .page-title {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html">

                JobVault

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarContent">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link text-white"
                            href="index.html">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link text-white"
                            href="applications.html">

                            Applications

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link text-white active"
                            href="resume_builder.html">

                            Resume Builder

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link text-white"
                            href="home.html">

                            Dashboard

                        </a>

                    </li>

                </ul>


                <div class="d-flex">

                    <button
                        class="btn btn-outline-light btn-sm px-3"
                        onclick="handleLogout()">

                        Logout

                    </button>

                </div>

            </div>

        </div>

    </nav>



    <!-- MAIN -->

    <main>

        <div class="container">

            <div class="mb-4">

                <h1 class="page-title">
                    Resume Information
                </h1>

                <p class="page-subtitle">
                    Enter your information to create your professional resume.
                </p>

            </div>


            <div class="card resume-form-card shadow-sm">

                <form id="resumeForm">


                    <!-- PERSONAL -->

                    <div>

                        <h2 class="section-title">
                            Personal Information
                        </h2>

                        <div class="row g-3">

                            <div class="col-12">

                                <label
                                    for="fullName"
                                    class="form-label">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    id="fullName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email

                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="phone"
                                    class="form-label">

                                    Phone Number

                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    class="form-control"
                                    placeholder="Enter your phone number"
                                    required>

                            </div>


                            <div class="col-12">

                                <label
                                    for="linkedin"
                                    class="form-label">

                                    LinkedIn

                                </label>

                                <input
                                    type="url"
                                    id="linkedin"
                                    class="form-control"
                                    placeholder="https://linkedin.com/in/your-profile">

                            </div>

                        </div>

                    </div>


                    <hr class="section-divider">


                    <!-- EDUCATION -->

                    <div>

                        <h2 class="section-title">
                            Education
                        </h2>

                        <div class="row g-3">

                            <div class="col-12">

                                <label
                                    for="college"
                                    class="form-label">

                                    College / University

                                </label>

                                <input
                                    type="text"
                                    id="college"
                                    class="form-control"
                                    placeholder="Enter college or university">

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="degree"
                                    class="form-label">

                                    Degree

                                </label>

                                <input
                                    type="text"
                                    id="degree"
                                    class="form-control"
                                    placeholder="e.g. B.Tech Computer Science">

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="graduationYear"
                                    class="form-label">

                                    Graduation Year

                                </label>

                                <input
                                    type="text"
                                    id="graduationYear"
                                    class="form-control"
                                    placeholder="e.g. 2027">

                            </div>

                        </div>

                    </div>


                    <hr class="section-divider">


                    <!-- EXPERIENCE -->

                    <div>

                        <h2 class="section-title">
                            Experience
                        </h2>

                        <div class="row g-3">

                            <div class="col-12">

                                <label
                                    for="company"
                                    class="form-label">

                                    Company

                                </label>

                                <input
                                    type="text"
                                    id="company"
                                    class="form-control"
                                    placeholder="Enter company name">

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="jobRole"
                                    class="form-label">

                                    Job Role

                                </label>

                                <input
                                    type="text"
                                    id="jobRole"
                                    class="form-control"
                                    placeholder="e.g. Software Developer">

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="experienceDuration"
                                    class="form-label">

                                    Duration

                                </label>

                                <input
                                    type="text"
                                    id="experienceDuration"
                                    class="form-control"
                                    placeholder="e.g. Jan 2025 - Present">

                            </div>

                        </div>

                    </div>


                    <hr class="section-divider">


                    <!-- SKILLS -->

                    <div>

                        <h2 class="section-title">
                            Skills
                        </h2>

                        <label
                            for="skills"
                            class="form-label">

                            Skills

                        </label>

                        <textarea
                            id="skills"
                            class="form-control"
                            rows="4"
                            placeholder="Java, HTML, CSS, JavaScript, SQL"></textarea>

                    </div>


                    <hr class="section-divider">


                    <!-- PROJECTS -->

                    <div>

                        <h2 class="section-title">
                            Projects
                        </h2>

                        <label
                            for="projects"
                            class="form-label">

                            Projects

                        </label>

                        <textarea
                            id="projects"
                            class="form-control"
                            rows="5"
                            placeholder="Enter your projects and their details"></textarea>

                    </div>


                    <div class="d-flex justify-content-end mt-4">

                        <button
                            type="submit"
                            class="btn btn-dark">

                            Update Resume

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer>

        <div class="container">

            <div class="footer-brand">
                JobVault
            </div>

            <div class="footer-text">
                Build your professional resume with JobVault.
            </div>

        </div>

    </footer>



    <script>

        /* LOGIN CHECK */

        let currentUser =
            JSON.parse(
                sessionStorage.getItem("currentUser")
            );

        let isLoggedIn =
            sessionStorage.getItem("isLoggedIn");


        if (
            isLoggedIn !== "true" ||
            !currentUser
        ) {

            window.location.href = "login.html";

        }


        /* LOAD SAVED RESUME */

        const savedData =
            localStorage.getItem("jobVaultResume");


        if (savedData) {

            const data =
                JSON.parse(savedData);


            document.getElementById("fullName").value =
                data.fullName || "";

            document.getElementById("email").value =
                data.email || "";

            document.getElementById("phone").value =
                data.phone || "";

            document.getElementById("linkedin").value =
                data.linkedin || "";

            document.getElementById("college").value =
                data.college || "";

            document.getElementById("degree").value =
                data.degree || "";

            document.getElementById("graduationYear").value =
                data.graduationYear || "";

            document.getElementById("company").value =
                data.company || "";

            document.getElementById("jobRole").value =
                data.jobRole || "";

            document.getElementById("experienceDuration").value =
                data.experienceDuration || "";

            document.getElementById("skills").value =
                data.skills || "";

            document.getElementById("projects").value =
                data.projects || "";

        }


        /* SAVE RESUME */

        document
            .getElementById("resumeForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const resumeData = {

                    fullName:
                        document.getElementById("fullName").value,

                    email:
                        document.getElementById("email").value,

                    phone:
                        document.getElementById("phone").value,

                    linkedin:
                        document.getElementById("linkedin").value,

                    college:
                        document.getElementById("college").value,

                    degree:
                        document.getElementById("degree").value,

                    graduationYear:
                        document.getElementById("graduationYear").value,

                    company:
                        document.getElementById("company").value,

                    jobRole:
                        document.getElementById("jobRole").value,

                    experienceDuration:
                        document.getElementById("experienceDuration").value,

                    skills:
                        document.getElementById("skills").value,

                    projects:
                        document.getElementById("projects").value

                };


                localStorage.setItem(
                    "jobVaultResume",
                    JSON.stringify(resumeData)
                );


                window.location.href =
                    "template.html";

            });


        /* LOGOUT */

        function handleLogout() {

            sessionStorage.removeItem("currentUser");

            sessionStorage.removeItem("isLoggedIn");

            sessionStorage.removeItem("showWelcome");

            window.location.href =
                "index.html";

        }

    </script>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
